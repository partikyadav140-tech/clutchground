name: Keep Render Active

on:
  schedule:
    # Run every 10 minutes (adjust as needed, but keep under 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          # Ping the main site to keep it active
          curl -f https://clutchground-1.onrender.com/ || curl -f https://clutchground-1.onrender.com

      - name: Ping Alternative URL (if needed)
        run: |
          # Add additional ping if you have multiple endpoints
          curl -f https://clutchground.onrender.com/api/health || echo "Health check endpoint not available"