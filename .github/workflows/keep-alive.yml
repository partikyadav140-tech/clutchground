name: Keep Render Active

on:
  schedule:
    # Run every 10 minutes (adjust as needed, but keep under 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          echo "Pinging Render app at $(date)"
          # Ping the main site to keep it active
          if curl -f --max-time 30 --retry 3 --retry-delay 5 https://clutchground-1.onrender.com/; then
            echo "✅ Main site ping successful"
          else
            echo "❌ Main site ping failed, trying alternative..."
            curl -f --max-time 30 https://clutchground-1.onrender.com/ || echo "Both pings failed"
          fi

      - name: Verify App Response
        run: |
          # Check if the app returns a proper HTML response
          response=$(curl -s -w "%{http_code}" https://clutchground-1.onrender.com/ -o /dev/null)
          if [ "$response" -eq 200 ]; then
            echo "✅ App responded with HTTP 200"
          else
            echo "⚠️  App responded with HTTP $response"
          fi