services:
  - type: web
    name: clutchground-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false   # Set this in Render dashboard (Neon PostgreSQL Connection String or arena.db path)
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
      - key: CLOUDINARY_URL
        sync: false   # Set this in Render dashboard
    healthCheckPath: /
    autoDeploy: true
